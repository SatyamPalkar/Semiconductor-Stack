services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: semiconductor
      POSTGRES_USER: semi
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semi -d semiconductor"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m
volumes:
  research_pgdata:
