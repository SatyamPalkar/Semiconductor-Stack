[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semiconductor-research"
version = "0.1.0"
description = "Point-in-time semiconductor research with traceable financial calculations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7", "numpy>=2,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
semi = "semiconductor_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semiconductor_research"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".python", "models", "data", "apps/web/node_modules", "apps/web/.next", "apps/web/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL database"]
